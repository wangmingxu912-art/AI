<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AQA A-Level 手写卷子自动评分（PDF）</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="title">AQA A-Level 手写 PDF 自动评分</h1>
        <p class="subtitle">
          流程：上传 PDF → 每页渲染成图片 → 自动识别连续题目答案块 → 调用 GPT-5.2（thinking）评分 → 在裁剪图上叠加错误框 → 输出总分
        </p>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <h2>1) 上传手写 PDF</h2>
        <div class="row">
          <input id="pdfFile" type="file" accept="application/pdf" />
          <button id="uploadBtn" class="btn">上传并渲染</button>
        </div>
        <div id="uploadStatus" class="status"></div>
      </section>

      <section class="card">
        <h2>2) 自动识别题目（连续答案块）并添加满分/评分标准</h2>
        <div class="grid2">
          <div>
            <div class="row space">
              <div class="status" style="margin:0">上传后点击“自动识别题目”生成 Q1、Q2…</div>
              <button id="autoBtn" class="btn secondary">自动识别题目</button>
            </div>
            <div id="pagesRoot" class="pages" style="margin-top:12px"></div>
          </div>
          <div>
            <div class="form">
              <label>
                默认满分（会应用到所有自动题目，可在下方逐题修改）
                <input id="defaultMax" type="number" step="0.5" min="0" value="1" />
              </label>
              <label>
                题干（可选；如果各题不同，请逐题填写）
                <textarea id="globalQText" rows="4" placeholder="粘贴 question text..."></textarea>
              </label>
              <label>
                评分标准 / mark scheme（可选；如果各题不同，请逐题填写）
                <textarea id="globalMs" rows="6" placeholder="粘贴 mark scheme..."></textarea>
              </label>
              <div id="selInfo" class="status">不再需要手动框选。</div>
            </div>

            <div class="questions">
              <div class="row space">
                <h3>已识别的题目</h3>
                <button id="gradeBtn" class="btn">开始评分</button>
              </div>
              <div id="questionsList" class="list"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>3) 评分结果（错误框叠加 + 总分）</h2>
        <div id="gradeStatus" class="status"></div>
        <div id="gradeSummary" class="summary"></div>
        <div id="gradeResults" class="results"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
